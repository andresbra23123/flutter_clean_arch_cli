name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Format, analysis and unit tests on the three desktop platforms.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # End-to-end: creates a real Flutter project and runs every command.
  # Slow, so only for tags (before a release) and on demand.
  e2e:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart test test_e2e

  # Publishes the GitHub Release of a tag once everything passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con pubspec.yaml
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión de pubspec.yaml ($version)."
            exit 1
          fi
      - name: Notas desde el CHANGELOG
        run: |
          awk -v header="## ${GITHUB_REF_NAME#v}" '
            $0 == header { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md no tiene una sección para ${GITHUB_REF_NAME#v}."
            exit 1
          fi
          {
            echo
            echo '**Instalar esta versión:**'
            echo '```bash'
            echo "dart pub global activate --source git https://github.com/${GITHUB_REPOSITORY} --git-ref ${GITHUB_REF_NAME}"
            echo '```'
          } >> notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
